<body>
    <!-- Certificate Modal -->
    <div id="certificate-modal" class="certificate-modal">
        <div class="certificate-content">
            <button class="certificate-close" id="certificate-close">&times;</button>

                Awarded to:
            </div>

            <div class="certificate-text">
                For Perfect Score in<br>AS Statistics: Measures of Location Quiz
            </div>

            <div class="certificate-date" id="certificate-date">Date: </div>
        </div>
    </div>

    <div class="container">
        <header>
            <h1><i class="fas fa-chart-bar"></i> AS Statistics: Measures of Location</h1>
            <p class="subtitle">Calculate Mean, Median, and Mode for different data types. Achieve 100% mastery to earn your certificate!</p>
            
            <div class="student-name-container">
                <div class="student-name-label">Student Name:</div>
                <input type="text" id="student-name" placeholder="Enter your name" maxlength="30">
            </div>
        </header>
        
        <div id="quiz-container">
            <!-- Questions will be generated here -->
        </div>
        
        <div class="submit-section">
            <button id="submit-btn"><i class="fas fa-check"></i> Submit Answers</button>
            <button id="retry-btn"><i class="fas fa-redo"></i> Retry Quiz</button>
        </div>
    </div>

    <script>
        // ==============================
        // HELPER FUNCTIONS
        // ==============================
        
        function randBetween(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        
        function getRandomOdd() {
            const options = [7, 9, 11];
            return options[Math.floor(Math.random() * options.length)];
        }
        
        function calculateMeanSingleValues(values) {
            const sum = values.reduce((a, b) => a + b, 0);
            return sum / values.length;
        }
        
        function calculateMeanFrequencyTable(values, frequencies) {
            let totalSum = 0;
            let totalFreq = 0;
            
            for (let i = 0; i < values.length; i++) {
                totalSum += values[i] * frequencies[i];
                totalFreq += frequencies[i];
            }
            
            return totalSum / totalFreq;
        }
        
        function calculateMedianSingleValues(values) {
            const sorted = [...values].sort((a, b) => a - b);
            const n = sorted.length;
            
            if (n % 2 === 1) {
                // Odd number of values
                return sorted[Math.floor(n / 2)];
            } else {
                // Even number of values
                const mid1 = sorted[n / 2 - 1];
                const mid2 = sorted[n / 2];
                return (mid1 + mid2) / 2;
            }
        }
        
        function calculateMedianFrequencyTable(values, frequencies) {
            // Create cumulative frequencies
            const cumFreq = [];
            let runningTotal = 0;
            
            for (let i = 0; i < frequencies.length; i++) {
                runningTotal += frequencies[i];
                cumFreq.push(runningTotal);
            }
            
            const totalFreq = runningTotal;
            const medianPosition = (totalFreq + 1) / 2;
            
            // Find which value contains the median
            for (let i = 0; i < cumFreq.length; i++) {
                if (cumFreq[i] >= medianPosition) {
                    return values[i];
                }
            }
            
            // If median falls between two values (even total frequency)
            // Find the two middle values
            let lowerValue, upperValue;
            for (let i = 0; i < cumFreq.length; i++) {
                if (cumFreq[i] >= Math.floor(medianPosition)) {
                    lowerValue = values[i];
                    break;
                }
            }
            
            for (let i = 0; i < cumFreq.length; i++) {
                if (cumFreq[i] >= Math.ceil(medianPosition)) {
                    upperValue = values[i];
                    break;
                }
            }
            
            return (lowerValue + upperValue) / 2;
        }
        
        function calculateModeSingleValues(values) {
            const freqMap = {};
            let maxFreq = 0;
            let mode = values[0];
            
            for (const value of values) {
                freqMap[value] = (freqMap[value] || 0) + 1;
                if (freqMap[value] > maxFreq) {
                    maxFreq = freqMap[value];
                    mode = value;
                }
            }
            
            return mode;
        }
        
        function calculateModeFrequencyTable(values, frequencies) {
            let maxFreq = 0;
            let mode = values[0];
            
            for (let i = 0; i < frequencies.length; i++) {
                if (frequencies[i] > maxFreq) {
                    maxFreq = frequencies[i];
                    mode = values[i];
                }
            }
            
            return mode;
        }
        
        // ==============================
        // QUESTION GENERATORS (10 Questions)
        // ==============================
        
        // ---------- Question 1 (Mean, single values, to 1 dp) ----------
        function generateQuestion1() {
            const n = randBetween(6, 9);
            const values = [];
            
            for (let i = 0; i < n; i++) {
                values.push(100 * randBetween(1, 9));
            }
            
            const mean = calculateMeanSingleValues(values);
            const sum = values.reduce((a, b) => a + b, 0);
            
            return {
                id: 1,
                text: `Meryll collected wild mushrooms every day for ${n} days. When she got home each day, she weighed them to the nearest 50g. The weights are shown below:<br><br><div class="number-list">${values.map(v => `<span class="number-item">${v}</span>`).join('')}</div><br>Calculate the mean for this data. <strong>Give your answer to 1 decimal place.</strong>`,
                answer: mean.toFixed(1),
                working: `Mean = (∑x)/n = (${values.join(' + ')})/${n} = ${sum}/${n} = ${mean.toFixed(2)} ≈ ${mean.toFixed(1)} g`
            };
        }
        
        // ---------- Question 2 (Mean, frequency table) ----------
        function generateQuestion2() {
            const values = [0, 1, 2, 3, 4, 5];
            const frequencies = [
                6 + randBetween(1, 3),
                10 + randBetween(1, 3),
                15 + randBetween(1, 3),
                15 + randBetween(1, 3),
                9 + randBetween(1, 3),
                5 + randBetween(1, 3)
            ];
            
            const mean = calculateMeanFrequencyTable(values, frequencies);
            
            let tableHTML = '<table class="data-table"><tr><th>Breakdowns (b)</th>';
            values.forEach(v => tableHTML += `<td>${v}</td>`);
            tableHTML += '</tr><tr><th>Frequency (f)</th>';
            frequencies.forEach(f => tableHTML += `<td>${f}</td>`);
            tableHTML += '</tr></table>';
            
            return {
                id: 2,
                text: `The frequency table shows the number of breakdowns, b, per month recorded by a road haulage firm over a certain period of time.${tableHTML}<br>Calculate the mean number of breakdowns (to 2 decimal places).`,
                answer: mean.toFixed(2),
                working: `Mean = (∑xf)/(∑f) = ${mean.toFixed(2)} breakdowns per month`
            };
        }
        
        // ---------- Question 3 (Mean, grouped data) ----------
        function generateQuestion3() {
            const classes = ["30 - 31", "32 - 33", "34 - 36", "37 - 39"];
            const midpoints = [30.5, 32.5, 35, 38];
            const frequencies = [
                2 + randBetween(1, 3),
                20 + randBetween(1, 5),
                25 + randBetween(1, 5),
                10 + randBetween(1, 3)
            ];
            
            let totalSum = 0;
            let totalFreq = 0;
            
            for (let i = 0; i < midpoints.length; i++) {
                totalSum += midpoints[i] * frequencies[i];
                totalFreq += frequencies[i];
            }
            
            const mean = totalSum / totalFreq;
            
            let tableHTML = '<table class="data-table"><tr><th>Length of pine cone (mm)</th>';
            classes.forEach(c => tableHTML += `<td>${c}</td>`);
            tableHTML += '</tr><tr><th>Frequency</th>';
            frequencies.forEach(f => tableHTML += `<td>${f}</td>`);
            tableHTML += '</tr></table>';
            
            return {
                id: 3,
                text: `The length x mm, to the nearest mm, of a random sample of pine-cones is measured. The data is shown in the table below:${tableHTML}<br>Estimate the mean length (to 2 decimal places).`,
                answer: mean.toFixed(2),
                working: `Mean ≈ (∑xf)/(∑f) = ${totalSum.toFixed(1)}/${totalFreq} = ${mean.toFixed(2)} mm`
            };
        }
        
        // ---------- Question 4 (Median, single values – odd count) ----------
        function generateQuestion4() {
            const n = getRandomOdd(); // 7, 9, or 11
            const values = [];
            
            for (let i = 0; i < n; i++) {
                values.push(100 * randBetween(1, 9));
            }
            
            const median = calculateMedianSingleValues(values);
            const sortedValues = [...values].sort((a, b) => a - b);
            
            return {
                id: 4,
                text: `Meryll collected wild mushrooms every day for ${n} days. When she got home each day, she weighed them to the nearest 50g. The weights are shown below:<br><br><div class="number-list">${values.map(v => `<span class="number-item">${v}</span>`).join('')}</div><br>Calculate the median for this data.`,
                answer: median.toFixed(0),
                working: `Sorted data: ${sortedValues.join(', ')}<br>Position of median = (${n}+1)/2 = ${(n+1)/2}<br>Median = ${(n+1)/2}th value = ${median}g`
            };
        }
        
        // ---------- Question 5 (Median, single values – even count) ----------
        function generateQuestion5() {
            const n = 10; // Fixed even number as per guidelines
            const values = [];
            
            for (let i = 0; i < n; i++) {
                values.push(100 * randBetween(1, 9));
            }
            
            const median = calculateMedianSingleValues(values);
            const sortedValues = [...values].sort((a, b) => a - b);
            
            return {
                id: 5,
                text: `David collected wild mushrooms every day for ${n} days. When he got home each day, he weighed them to the nearest 50g. The weights are shown below:<br><br><div class="number-list">${values.map(v => `<span class="number-item">${v}</span>`).join('')}</div><br>Calculate the median for this data.`,
                answer: median.toFixed(0),
                working: `Sorted data: ${sortedValues.join(', ')}<br>Position of median = (${n}+1)/2 = ${(n+1)/2} (between ${n/2}th and ${n/2 + 1}th values)<br>Median = (${sortedValues[n/2 - 1]} + ${sortedValues[n/2]})/2 = ${median}g`
            };
        }
        
        // ---------- Question 6 (Median, frequency table) ----------
        function generateQuestion6() {
            const values = [0, 1, 2, 3, 4, 5];
            const frequencies = [
                6 + randBetween(1, 3),
                10 + randBetween(1, 3),
                15 + randBetween(1, 3),
                15 + randBetween(1, 3),
                9 + randBetween(1, 3),
                5 + randBetween(1, 3)
            ];
            
            const median = calculateMedianFrequencyTable(values, frequencies);
            
            let tableHTML = '<table class="data-table"><tr><th>Breakdowns (b)</th>';
            values.forEach(v => tableHTML += `<td>${v}</td>`);
            tableHTML += '</tr><tr><th>Frequency (f)</th>';
            frequencies.forEach(f => tableHTML += `<td>${f}</td>`);
            tableHTML += '</tr></table>';
            
            return {
                id: 6,
                text: `The frequency table shows the number of breakdowns, b, per month recorded by a road haulage firm over a certain period of time.${tableHTML}<br>Calculate the median number of breakdowns.`,
                answer: median.toString(),
                working: `Median = ${median} breakdowns per month`
            };
        }
        
        // ---------- Question 7 (Median, grouped data) ----------
        function generateQuestion7() {
            const classes = ["30 - 31", "32 - 33", "34 - 36", "37 - 39"];
            const frequencies = [
                2 + randBetween(1, 3),
                20 + randBetween(1, 5),
                25 + randBetween(1, 5),
                10 + randBetween(1, 3)
            ];
            
            const totalFreq = frequencies.reduce((a, b) => a + b, 0);
            const medianPosition = totalFreq / 2;
            
            // Calculate cumulative frequencies
            const cumFreq = [];
            let runningTotal = 0;
            for (let i = 0; i < frequencies.length; i++) {
                runningTotal += frequencies[i];
                cumFreq.push(runningTotal);
            }
            
            // Find median class (34-36 based on guidelines)
            const medianClassIndex = 2; // "34 - 36" is at index 2
            const lowerBoundary = 33.5;
            const classWidth = 3.0;
            
            const freqBeforeMedianClass = medianClassIndex > 0 ? cumFreq[medianClassIndex - 1] : 0;
            const positionInClass = medianPosition - freqBeforeMedianClass;
            const fraction = positionInClass / frequencies[medianClassIndex];
            
            const median = lowerBoundary + fraction * classWidth;
            
            let tableHTML = '<table class="data-table"><tr><th>Length of pine cone (mm)</th>';
            classes.forEach(c => tableHTML += `<td>${c}</td>`);
            tableHTML += '</tr><tr><th>Frequency</th>';
            frequencies.forEach(f => tableHTML += `<td>${f}</td>`);
            tableHTML += '</tr></table>';
            
            return {
                id: 7,
                text: `The length x mm, to the nearest mm, of a random sample of pine-cones is measured. The data is shown in the table below:${tableHTML}<br>Estimate the median length (to 1 decimal place).`,
                answer: median.toFixed(1),
                working: `Total frequency = ${totalFreq}, Median position = ${totalFreq}/2 = ${medianPosition}<br>Median class = "34 - 36"<br>Median ≈ lower boundary + (position in class/class frequency) × class width = 33.5 + (${positionInClass.toFixed(1)}/${frequencies[medianClassIndex]}) × 3.0 = ${median.toFixed(1)} mm`
            };
        }
        
        // ---------- Question 8 (Mode, single values – guaranteed unique mode) ----------
        function generateQuestion8() {
            const values = [300, 400, 500, 700, 900];
            
            // Step 1: randomly select which value will be the unique mode
            const modeIndex = randBetween(0, 4);
            const modeValue = values[modeIndex];
            
            // Step 2: assign frequencies: mode gets highest (at least 3), others get lower (1 or 2)
            const frequencies = [];
            for (let i = 0; i < values.length; i++) {
                if (i === modeIndex) {
                    frequencies.push(randBetween(3, 5)); // mode appears 3–5 times
                } else {
                    frequencies.push(randBetween(1, 2)); // others appear 1 or 2 times (never tie with mode)
                }
            }
            
            // Create the data list
            const dataList = [];
            for (let i = 0; i < values.length; i++) {
                for (let j = 0; j < frequencies[i]; j++) {
                    dataList.push(values[i]);
                }
            }
            
            // Shuffle the list for realistic display
            for (let i = dataList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [dataList[i], dataList[j]] = [dataList[j], dataList[i]];
            }
            
            const mode = calculateModeSingleValues(dataList);
            
            return {
                id: 8,
                text: `Meryll collected wild mushrooms over several days. When she got home each day, she weighed them to the nearest 50g. The weights are shown below:<br><br><div class="number-list">${dataList.map(v => `<span class="number-item">${v}</span>`).join('')}</div><br>Calculate the mode for this data.`,
                answer: mode.toString(),
                working: `Mode = most frequent value = ${mode}g (appears ${frequencies[modeIndex]} times)`
            };
        }
        
        // ---------- Question 9 (Mode, frequency table) ----------
        function generateQuestion9() {
            const values = [0, 1, 2, 3, 4, 5];
            const frequencies = [
                6 + randBetween(1, 3),
                10 + randBetween(1, 3),
                15 + randBetween(1, 3),
                15 + randBetween(1, 3),
                9 + randBetween(1, 3),
                5 + randBetween(1, 3)
            ];
            
            const mode = calculateModeFrequencyTable(values, frequencies);
            
            let tableHTML = '<table class="data-table"><tr><th>Breakdowns (b)</th>';
            values.forEach(v => tableHTML += `<td>${v}</td>`);
            tableHTML += '</tr><tr><th>Frequency (f)</th>';
            frequencies.forEach(f => tableHTML += `<td>${f}</td>`);
            tableHTML += '</tr></table>';
            
            return {
                id: 9,
                text: `The frequency table shows the number of breakdowns, b, per month recorded by a road haulage firm over a certain period of time.${tableHTML}<br>Find the mode number of breakdowns.`,
                answer: mode.toString(),
                working: `Mode = value with highest frequency = ${mode} breakdowns (frequency = ${frequencies[values.indexOf(mode)]})`
            };
        }
        
        // ---------- Question 10 (Modal class) ----------
        function generateQuestion10() {
            const classes = ["30 - 31", "32 - 33", "34 - 36", "37 - 39"];
            const frequencies = [
                2 + randBetween(1, 3),
                20 + randBetween(1, 5),
                25 + randBetween(1, 5),
                10 + randBetween(1, 3)
            ];
            
            // Find class with highest frequency
            let maxFreq = 0;
            let modalClassIndex = 0;
            
            for (let i = 0; i < frequencies.length; i++) {
                if (frequencies[i] > maxFreq) {
                    maxFreq = frequencies[i];
                    modalClassIndex = i;
                }
            }
            
            const modalClass = classes[modalClassIndex];
            
            let tableHTML = '<table class="data-table"><tr><th>Length of pine cone (mm)</th>';
            classes.forEach(c => tableHTML += `<td>${c}</td>`);
            tableHTML += '</tr><tr><th>Frequency</th>';
            frequencies.forEach(f => tableHTML += `<td>${f}</td>`);
            tableHTML += '</tr></table>';
            
            return {
                id: 10,
                text: `The length x mm, to the nearest mm, of a random sample of pine-cones is measured. The data is shown in the table below:${tableHTML}<br>Find the modal class.`,
                answer: modalClass,
                working: `Modal class = class with highest frequency = "${modalClass}" (frequency = ${maxFreq})`
            };
        }
        
        // ==============================
        // QUIZ STATE
        // ==============================
        
        let currentQuestions = [];
        let hasSubmitted = false;
        
        // ==============================
        // QUIZ RENDERING AND LOGIC
        // ==============================
        
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            if (!container) {
                console.error('quiz-container not found!');
                return;
            }
            
            container.innerHTML = '';
            
            currentQuestions.forEach((question, index) => {
                const questionNum = index + 1;
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-container';
                questionDiv.id = `question-${questionNum}`;
                
                let questionHTML = `
                    <div class="question-header">
                        <div class="question-number">Question ${questionNum}</div>
                    </div>
                    <div class="question-text">
                        <p>${question.text}</p>
                    </div>
                `;
                
                if (question.expression) {
                    questionHTML += `
                        <div class="expression">${question.expression}</div>
                    `;
                }
                
                questionHTML += `
                    <input type="text" class="answer-input" id="answer-${questionNum}" 
                           placeholder="Enter your answer" data-question-id="${questionNum}"
                           autocomplete="off" ${hasSubmitted ? 'disabled' : ''}>
                    <div class="answer-feedback" id="feedback-${questionNum}"></div>
                `;
                
                if (question.instruction) {
                    questionHTML += `<div class="instruction">${question.instruction}</div>`;
                }
                
                questionDiv.innerHTML = questionHTML;
                container.appendChild(questionDiv);
            });
            
            setupAutoFocus();
        }
        
        function setupAutoFocus() {
            const inputs = document.querySelectorAll('.answer-input:not(:disabled)');
            
            inputs.forEach((input, index) => {
                input.onkeydown = null;
                
                input.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        
                        const nextIndex = index + 1;
                        if (nextIndex < inputs.length) {
                            inputs[nextIndex].focus();
                        } else {
                            document.getElementById('submit-btn').focus();
                        }
                    }
                });
            });
            
            setTimeout(() => {
                if (inputs.length > 0) {
                    inputs[0].focus();
                }
            }, 100);
        }
        
        function initializeQuiz() {
            hasSubmitted = false;
            currentQuestions = [
                generateQuestion1(),
                generateQuestion2(),
                generateQuestion3(),
                generateQuestion4(),
                generateQuestion5(),
                generateQuestion6(),
                generateQuestion7(),
                generateQuestion8(),
                generateQuestion9(),
                generateQuestion10()
            ];
            
            renderQuiz();
            document.getElementById('submit-btn').disabled = false;
        }
        
        function normalizeAnswer(answer) {
            // Remove spaces and convert to lowercase
            return answer.trim().toLowerCase().replace(/\s+/g, '');
        }
        
        function compareAnswers(userAnswer, correctAnswer) {
            userAnswer = normalizeAnswer(userAnswer);
            correctAnswer = normalizeAnswer(correctAnswer);
            
            // For answers that might have different representations
            if (userAnswer === correctAnswer) return true;
            
            // Allow slight variations in decimal answers
            if (!isNaN(parseFloat(userAnswer)) && !isNaN(parseFloat(correctAnswer))) {
                const userNum = parseFloat(userAnswer);
                const correctNum = parseFloat(correctAnswer);
                return Math.abs(userNum - correctNum) < 0.01;
            }
            
            return false;
        }
        
        function checkAnswers() {
            if (hasSubmitted) return;
            
            hasSubmitted = true;
            document.getElementById('submit-btn').disabled = true;
            
            let score = 0;
            let total = currentQuestions.length;
            let allCorrect = true;
            
            document.querySelectorAll('.answer-input').forEach(input => {
                input.disabled = true;
            });
            
            currentQuestions.forEach((question, index) => {
                const questionNum = index + 1;
                const input = document.getElementById(`answer-${questionNum}`);
                const userAnswer = input.value.trim();
                const feedback = document.getElementById(`feedback-${questionNum}`);
                
                const isCorrect = compareAnswers(userAnswer, question.answer);
                
                if (isCorrect) {
                    score++;
                    input.style.borderColor = '#27ae60';
                    input.style.backgroundColor = 'rgba(39, 174, 96, 0.1)';
                    
                    feedback.className = 'answer-feedback correct-feedback';
                    feedback.innerHTML = `
                        <div class="feedback-title">✓ Correct!</div>
                        <div>${question.working}</div>
                    `;
                } else {
                    allCorrect = false;
                    input.style.borderColor = '#e74c3c';
                    input.style.backgroundColor = 'rgba(231, 76, 60, 0.1)';
                    
                    feedback.className = 'answer-feedback incorrect-feedback';
                    feedback.innerHTML = `
                        <div class="feedback-title">✗ Incorrect</div>
                        <div>${question.working}</div>
                        <div class="correct-answer">Correct answer: ${question.answer}</div>
                    `;
                }
                
                feedback.style.display = 'block';
            });
            
            const percentage = Math.round((score/total)*100);
            
            if (allCorrect && score === total) {
                setTimeout(() => {
                    showCertificate(percentage);
                }, 500);
            } else {
                setTimeout(() => {
                    alert(`You got ${score} out of ${total} correct (${percentage}%)\n\nClick "Retry Quiz" to try again and aim for 100%!`);
                }, 300);
            }
        }
        
        function showCertificate(score) {
            const studentName = document.getElementById('student-name').value || 'Student';
            const certificateName = document.getElementById('certificate-name');
            const certificateScore = document.getElementById('certificate-score');
            const certificateDate = document.getElementById('certificate-date');
            
            certificateName.textContent = studentName;
            certificateScore.textContent = `Score: ${score}%`;
            
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            certificateDate.textContent = `Date: ${now.toLocaleDateString('en-US', options)}`;
            
            document.getElementById('certificate-modal').style.display = 'flex';
        }
        
        function closeCertificate() {
            document.getElementById('certificate-modal').style.display = 'none';
        }
        
        function retryQuiz() {
            document.querySelectorAll('.answer-input').forEach(input => {
                input.value = '';
                input.style.borderColor = '';
                input.style.backgroundColor = '';
                input.disabled = false;
            });
            
            document.querySelectorAll('.answer-feedback').forEach(feedback => {
                feedback.innerHTML = '';
                feedback.style.display = 'none';
            });
            
            initializeQuiz();
        }
        
        // ==============================
        // INITIALIZATION
        // ==============================
        
        document.addEventListener('DOMContentLoaded', () => {
            initializeQuiz();
            
            document.getElementById('submit-btn').addEventListener('click', checkAnswers);
            document.getElementById('retry-btn').addEventListener('click', retryQuiz);
            document.getElementById('certificate-close').addEventListener('click', closeCertificate);
            
            document.getElementById('certificate-modal').addEventListener('click', function(e) {
                if (e.target === this) closeCertificate();
            });
            
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeCertificate();
            });
            
            document.getElementById('student-name').focus();
            
            document.getElementById('student-name').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const firstInput = document.querySelector('.answer-input:not(:disabled)');
                    if (firstInput) {
                        firstInput.focus();
                    }
                }
            });
        });
    </script>
</body>
</html>
