<body>
    <!-- Certificate Modal -->
    <div id="certificate-modal" class="certificate-modal">
        <div class="certificate-content">
            <button class="certificate-close" id="certificate-close">&times;</button>
            <div class="certificate-header">

                Awarded to:
            </div>

                For Perfect Score in<br>Factors, Multiples and Primes Quiz
            </div>
            <div class="certificate-score" id="certificate-score">Score: 100%</div>
            <div class="certificate-date" id="certificate-date">Date: </div>
        </div>
    </div>

    <div class="container">
        <header>
            <h1><i class="fas fa-calculator"></i> Factors, Multiples and Primes Quiz</h1>
            <p class="subtitle">Complete all 12 questions. Achieve 100% mastery to earn your certificate!</p>
            
            <div class="student-name-container">
                <div class="student-name-label">Student Name:</div>
                <input type="text" id="student-name" placeholder="Enter your name" maxlength="30">
            </div>
        </header>
        
        <div id="quiz-container">
            <!-- Questions will be generated here -->
        </div>
        
        <div class="submit-section">
            <button id="submit-btn"><i class="fas fa-check"></i> Submit Answers</button>
            <button id="retry-btn"><i class="fas fa-redo"></i> Retry Quiz</button>
        </div>
    </div>

    <script>
        // ==============================
        // HELPER FUNCTIONS
        // ==============================
        
        function randBetween(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        
        function getSuperscript(num) {
            const superscripts = {
                '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', 
                '7': '⁷', '8': '⁸', '9': '⁹'
            };
            return num.toString().split('').map(digit => superscripts[digit]).join('');
        }
        
        function isPrime(num) {
            if (num <= 1) return false;
            if (num <= 3) return true;
            if (num % 2 === 0 || num % 3 === 0) return false;
            let i = 5;
            while (i * i <= num) {
                if (num % i === 0 || num % (i + 2) === 0) return false;
                i += 6;
            }
            return true;
        }
        
        function getFactors(num) {
            const factors = [];
            for (let i = 1; i <= Math.sqrt(num); i++) {
                if (num % i === 0) {
                    factors.push(i);
                    if (i !== num / i) {
                        factors.push(num / i);
                    }
                }
            }
            return factors.sort((a, b) => a - b);
        }
        
        function getPrimeFactors(num) {
            let n = num;
            const factors = {};
            let divisor = 2;
            
            while (n >= 2) {
                if (n % divisor === 0) {
                    factors[divisor] = (factors[divisor] || 0) + 1;
                    n = n / divisor;
                } else {
                    divisor++;
                }
            }
            return factors;
        }
        
        function formatPrimeFactors(factors) {
            const parts = [];
            for (const [prime, power] of Object.entries(factors)) {
                if (power === 1) {
                    parts.push(prime);
                } else {
                    parts.push(`${prime}${getSuperscript(power)}`);
                }
            }
            return parts.join(' × ');
        }
        
        function getHCF(a, b) {
            while (b !== 0) {
                let temp = b;
                b = a % b;
                a = temp;
            }
            return a;
        }
        
        function getLCM(a, b) {
            return (a * b) / getHCF(a, b);
        }
        
        // ==============================
        // QUESTION GENERATORS (12 Questions)
        // ==============================
        
        // Question 1: Multiple of a between 10b and 10(b+1)
        function generateQuestion1() {
            const a = randBetween(2, 9);
            const b = randBetween(1, 9);
            const lower = 10 * b;
            const upper = 10 * (b + 1);
            
            // Find multiples of a between lower and upper
            const multiples = [];
            let current = Math.ceil(lower / a) * a;
            while (current <= upper) {
                if (current > lower && current < upper) {
                    multiples.push(current);
                }
                current += a;
            }
            
            // Pick a random multiple from the list
            const answer = multiples[Math.floor(Math.random() * multiples.length)];
            
            return {
                id: 1,
                text: `Write down a multiple of ${a} that is between ${lower} and ${upper}.`,
                answer: answer.toString(),
                working: `Multiples of ${a} between ${lower} and ${upper}: ${multiples.join(', ')}`
            };
        }
        
        // Question 2: First even multiple of 2a + 1
        function generateQuestion2() {
            const a = randBetween(2, 9);
            const base = 2 * a + 1;
            // The first even multiple is base * 2
            const answer = base * 2;
            
            return {
                id: 2,
                text: `Write down the first even multiple of ${base}.`,
                answer: answer.toString(),
                working: `The first even multiple of ${base} is ${base} × 2 = ${answer}`
            };
        }
        
        // Question 3: Prime number between 10a-5 and 10a+5
        function generateQuestion3() {
            const a = randBetween(1, 9);
            const lower = 10 * a - 5;
            const upper = 10 * a + 5;
            
            const primes = [];
            for (let i = lower; i <= upper; i++) {
                if (isPrime(i) && i > 1) {
                    primes.push(i);
                }
            }
            
            const answer = primes[Math.floor(Math.random() * primes.length)];
            
            return {
                id: 3,
                text: `Write down a prime number between ${lower} and ${upper}.`,
                answer: answer.toString(),
                working: `Prime numbers between ${lower} and ${upper}: ${primes.join(', ')}`
            };
        }
        
        // Question 4: Two factors of n where n = a × b × c
        function generateQuestion4() {
            const a = randBetween(2, 5);
            const b = randBetween(2, 5);
            const c = randBetween(2, 5);
            const n = a * b * c;
            const factors = getFactors(n);
            
            // Remove 1 and n itself
            const usableFactors = factors.filter(f => f !== 1 && f !== n);
            
            // Pick two random factors
            const factor1 = usableFactors[Math.floor(Math.random() * usableFactors.length)];
            let factor2;
            do {
                factor2 = usableFactors[Math.floor(Math.random() * usableFactors.length)];
            } while (factor2 === factor1);
            
            const sortedFactors = [factor1, factor2].sort((x, y) => x - y);
            const answer = sortedFactors.join(', ');
            
            return {
                id: 4,
                text: `Write down two factors of ${n}.`,
                answer: answer,
                working: `Factors of ${n}: ${factors.join(', ')}. Two factors are ${factor1} and ${factor2}.`
            };
        }
        
        // Question 5: All prime numbers between 10a and 10(a+1)
        function generateQuestion5() {
            const a = randBetween(1, 9);
            const lower = 10 * a;
            const upper = 10 * (a + 1);
            
            const primes = [];
            for (let i = lower; i <= upper; i++) {
                if (isPrime(i) && i > 1) {
                    primes.push(i);
                }
            }
            
            const answer = primes.join(', ');
            
            return {
                id: 5,
                text: `Write down all the prime numbers between ${lower} and ${upper}.`,
                answer: answer,
                working: `Prime numbers between ${lower} and ${upper}: ${answer}`
            };
        }
        
        // Question 6: Two multiples of a
        function generateQuestion6() {
            const a = randBetween(1, 9);
            // Generate two different multiples (not 0 or a itself)
            const multiple1 = a * randBetween(2, 5);
            let multiple2;
            do {
                multiple2 = a * randBetween(2, 5);
            } while (multiple2 === multiple1);
            
            const sortedMultiples = [multiple1, multiple2].sort((x, y) => x - y);
            const answer = sortedMultiples.join(', ');
            
            return {
                id: 6,
                text: `Write down two multiples of ${a}.`,
                answer: answer,
                working: `Some multiples of ${a}: ${a}, ${a*2}, ${a*3}, ${a*4}, ${a*5}, etc. Two examples are ${multiple1} and ${multiple2}.`
            };
        }
        
        // Question 7: From list a to a+9: factor of 8
        function generateQuestion7() {
            const a = randBetween(1, 9);
            const numbers = Array.from({length: 10}, (_, i) => a + i);
            
            const factorsOf8 = [1, 2, 4, 8];
            const availableFactors = numbers.filter(n => factorsOf8.includes(n));
            
            const answer = availableFactors[Math.floor(Math.random() * availableFactors.length)];
            
            return {
                id: 7,
                text: `Here is a list of numbers: ${numbers.join(', ')}. Write down a factor of 8 from the list.`,
                answer: answer.toString(),
                working: `Factors of 8 are: 1, 2, 4, 8. From the list, ${availableFactors.join(', ')} are factors of 8.`
            };
        }
        
        // Question 8: From list a to a+9: multiple of 6
        function generateQuestion8() {
            const a = randBetween(1, 9);
            const numbers = Array.from({length: 10}, (_, i) => a + i);
            
            const multiplesOf6 = numbers.filter(n => n % 6 === 0);
            
            const answer = multiplesOf6[Math.floor(Math.random() * multiplesOf6.length)];
            
            return {
                id: 8,
                text: `Here is a list of numbers: ${numbers.join(', ')}. Write down a multiple of 6 from the list.`,
                answer: answer.toString(),
                working: `Multiples of 6 in the list: ${multiplesOf6.join(', ')}`
            };
        }
        
        // Question 9: From list a to a+9: square number
        function generateQuestion9() {
            const a = randBetween(1, 9);
            const numbers = Array.from({length: 10}, (_, i) => a + i);
            
            const squares = numbers.filter(n => {
                const sqrt = Math.sqrt(n);
                return Math.floor(sqrt) === sqrt;
            });
            
            const answer = squares[Math.floor(Math.random() * squares.length)];
            
            return {
                id: 9,
                text: `Here is a list of numbers: ${numbers.join(', ')}. Write down a square number from the list.`,
                answer: answer.toString(),
                working: `Square numbers in the list: ${squares.join(', ')}`
            };
        }
        
        // Question 10: Prime factors of n = 3^a × 5^b × 7^c × 11^d
        function generateQuestion10() {
            const a = randBetween(0, 3);
            const b = randBetween(0, 3);
            const c = randBetween(0, 2);
            const d = randBetween(0, 1);
            
            const n = Math.pow(3, a) * Math.pow(5, b) * Math.pow(7, c) * Math.pow(11, d);
            
            const primeFactors = {};
            if (a > 0) primeFactors[3] = a;
            if (b > 0) primeFactors[5] = b;
            if (c > 0) primeFactors[7] = c;
            if (d > 0) primeFactors[11] = d;
            
            const answer = formatPrimeFactors(primeFactors);
            
            return {
                id: 10,
                text: `Write ${n} as a product of prime factors (in index form).`,
                answer: answer,
                working: `${n} = ${answer}`
            };
        }
        
        // Question 11: HCF of m and n with specific format
        function generateQuestion11() {
            // Generate exponents for primes 5, 7, 11
            const exp5_n = randBetween(1, 3);  // For 5 in n
            const exp7_n = randBetween(1, 3);  // For 7 in n
            const exp11_n = randBetween(1, 2); // For 11 in n
            
            // Generate exponents for m (usually similar but with some variation)
            const exp5_m = randBetween(1, 3);
            const exp7_m = randBetween(1, 3);
            const exp11_m = randBetween(1, 2);
            
            // Format the expressions
            const formatExpression = (exp5, exp7, exp11) => {
                const parts = [];
                if (exp5 > 0) parts.push(`5${getSuperscript(exp5)}`);
                if (exp7 > 0) parts.push(`7${getSuperscript(exp7)}`);
                if (exp11 > 0) parts.push(`11`);
                return parts.join(' × ');
            };
            
            const nExpression = formatExpression(exp5_n, exp7_n, exp11_n);
            const mExpression = formatExpression(exp5_m, exp7_m, exp11_m);
            
            // Calculate HCF (take minimum exponents)
            const hcfExp5 = Math.min(exp5_n, exp5_m);
            const hcfExp7 = Math.min(exp7_n, exp7_m);
            const hcfExp11 = Math.min(exp11_n, exp11_m);
            
            // Calculate the actual HCF value
            const hcf = Math.pow(5, hcfExp5) * Math.pow(7, hcfExp7) * Math.pow(11, hcfExp11);
            
            // Format HCF expression
            const hcfExpression = formatExpression(hcfExp5, hcfExp7, hcfExp11);
            
            return {
                id: 11,
                text: `Find the highest common factor [HCF] of two numbers m and n. Give your answer in index form.`,
                expression: `n = ${nExpression}<br>m = ${mExpression}`,
                instruction: "Enter your answer in index form (e.g., 5² × 7² × 11)",
                answer: hcfExpression,
                working: `HCF = ${hcfExpression} = ${hcf}`
            };
        }
        
        // Question 12: LCM of m and n with specific format
        function generateQuestion12() {
            // Generate exponents for primes 5, 7, 11
            const exp5_n = randBetween(1, 3);  // For 5 in n
            const exp7_n = randBetween(1, 3);  // For 7 in n
            const exp11_n = randBetween(1, 2); // For 11 in n
            
            // Generate exponents for m (different from n)
            const exp5_m = randBetween(1, 3);
            const exp7_m = randBetween(1, 3);
            const exp11_m = randBetween(1, 2);
            
            // Format the expressions
            const formatExpression = (exp5, exp7, exp11) => {
                const parts = [];
                if (exp5 > 0) parts.push(`5${getSuperscript(exp5)}`);
                if (exp7 > 0) parts.push(`7${getSuperscript(exp7)}`);
                if (exp11 > 0) parts.push(`11`);
                return parts.join(' × ');
            };
            
            const nExpression = formatExpression(exp5_n, exp7_n, exp11_n);
            const mExpression = formatExpression(exp5_m, exp7_m, exp11_m);
            
            // Calculate LCM (take maximum exponents)
            const lcmExp5 = Math.max(exp5_n, exp5_m);
            const lcmExp7 = Math.max(exp7_n, exp7_m);
            const lcmExp11 = Math.max(exp11_n, exp11_m);
            
            // Calculate the actual LCM value
            const lcm = Math.pow(5, lcmExp5) * Math.pow(7, lcmExp7) * Math.pow(11, lcmExp11);
            
            // Format LCM expression
            const lcmExpression = formatExpression(lcmExp5, lcmExp7, lcmExp11);
            
            return {
                id: 12,
                text: `Find the lowest common multiple [LCM] of two numbers m and n. Give your answer in index form.`,
                expression: `n = ${nExpression}<br>m = ${mExpression}`,
                instruction: "Enter your answer in index form (e.g., 5² × 7² × 11)",
                answer: lcmExpression,
                working: `LCM = ${lcmExpression} = ${lcm}`
            };
        }
        
        // ==============================
        // QUIZ STATE
        // ==============================
        
        let currentQuestions = [];
        let hasSubmitted = false;
        
        // ==============================
        // QUIZ RENDERING AND LOGIC
        // ==============================
        
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            if (!container) {
                console.error('quiz-container not found!');
                return;
            }
            
            container.innerHTML = '';
            
            currentQuestions.forEach((question, index) => {
                const questionNum = index + 1;
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-container';
                questionDiv.id = `question-${questionNum}`;
                
                let questionHTML = `
                    <div class="question-header">
                        <div class="question-number">Question ${questionNum}</div>
                    </div>
                    <div class="question-text">
                        <p>${question.text}</p>
                    </div>
                `;
                
                if (question.expression) {
                    questionHTML += `
                        <div class="expression">${question.expression}</div>
                    `;
                }
                
                questionHTML += `
                    <input type="text" class="answer-input" id="answer-${questionNum}" 
                           placeholder="Enter your answer" data-question-id="${questionNum}"
                           autocomplete="off" ${hasSubmitted ? 'disabled' : ''}>
                    <div class="answer-feedback" id="feedback-${questionNum}"></div>
                `;
                
                if (question.instruction) {
                    questionHTML += `<div class="instruction">${question.instruction}</div>`;
                }
                
                questionDiv.innerHTML = questionHTML;
                container.appendChild(questionDiv);
            });
            
            setupAutoFocus();
        }
        
        function setupAutoFocus() {
            const inputs = document.querySelectorAll('.answer-input:not(:disabled)');
            
            inputs.forEach((input, index) => {
                input.onkeydown = null;
                
                input.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        
                        const nextIndex = index + 1;
                        if (nextIndex < inputs.length) {
                            inputs[nextIndex].focus();
                        } else {
                            document.getElementById('submit-btn').focus();
                        }
                    }
                });
            });
            
            setTimeout(() => {
                if (inputs.length > 0) {
                    inputs[0].focus();
                }
            }, 100);
        }
        
        function initializeQuiz() {
            hasSubmitted = false;
            currentQuestions = [
                generateQuestion1(),
                generateQuestion2(),
                generateQuestion3(),
                generateQuestion4(),
                generateQuestion5(),
                generateQuestion6(),
                generateQuestion7(),
                generateQuestion8(),
                generateQuestion9(),
                generateQuestion10(),
                generateQuestion11(),
                generateQuestion12()
            ];
            
            // Debug log to check if questions are generated
            console.log('Questions generated:', currentQuestions);
            
            renderQuiz();
            document.getElementById('submit-btn').disabled = false;
        }
        
        function normalizeAnswer(answer) {
            // Remove spaces and convert to lowercase
            return answer.trim().toLowerCase().replace(/\s+/g, '');
        }
        
        function compareAnswers(userAnswer, correctAnswer) {
            userAnswer = normalizeAnswer(userAnswer);
            correctAnswer = normalizeAnswer(correctAnswer);
            
            // For comma-separated answers, sort both and compare
            if (userAnswer.includes(',') && correctAnswer.includes(',')) {
                const userParts = userAnswer.split(',').map(s => s.trim()).sort();
                const correctParts = correctAnswer.split(',').map(s => s.trim()).sort();
                return JSON.stringify(userParts) === JSON.stringify(correctParts);
            }
            
            return userAnswer === correctAnswer;
        }
        
        function checkAnswers() {
            if (hasSubmitted) return;
            
            hasSubmitted = true;
            document.getElementById('submit-btn').disabled = true;
            
            let score = 0;
            let total = currentQuestions.length;
            let allCorrect = true;
            
            document.querySelectorAll('.answer-input').forEach(input => {
                input.disabled = true;
            });
            
            currentQuestions.forEach((question, index) => {
                const questionNum = index + 1;
                const input = document.getElementById(`answer-${questionNum}`);
                const userAnswer = input.value.trim();
                const feedback = document.getElementById(`feedback-${questionNum}`);
                
                const isCorrect = compareAnswers(userAnswer, question.answer);
                
                if (isCorrect) {
                    score++;
                    input.style.borderColor = '#27ae60';
                    input.style.backgroundColor = 'rgba(39, 174, 96, 0.1)';
                    
                    feedback.className = 'answer-feedback correct-feedback';
                    feedback.innerHTML = `
                        <div class="feedback-title">✓ Correct!</div>
                        <div>${question.working}</div>
                    `;
                } else {
                    allCorrect = false;
                    input.style.borderColor = '#e74c3c';
                    input.style.backgroundColor = 'rgba(231, 76, 60, 0.1)';
                    
                    feedback.className = 'answer-feedback incorrect-feedback';
                    feedback.innerHTML = `
                        <div class="feedback-title">✗ Incorrect</div>
                        <div>${question.working}</div>
                        <div class="correct-answer">Correct answer: ${question.answer}</div>
                    `;
                }
                
                feedback.style.display = 'block';
            });
            
            const percentage = Math.round((score/total)*100);
            
            if (allCorrect && score === total) {
                setTimeout(() => {
                    showCertificate(percentage);
                }, 500);
            } else {
                setTimeout(() => {
                    alert(`You got ${score} out of ${total} correct (${percentage}%)\n\nClick "Retry Quiz" to try again and aim for 100%!`);
                }, 300);
            }
        }
        
        function showCertificate(score) {
            const studentName = document.getElementById('student-name').value || 'Student';
            const certificateName = document.getElementById('certificate-name');
            const certificateScore = document.getElementById('certificate-score');
            const certificateDate = document.getElementById('certificate-date');
            
            certificateName.textContent = studentName;
            certificateScore.textContent = `Score: ${score}%`;
            
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            certificateDate.textContent = `Date: ${now.toLocaleDateString('en-US', options)}`;
            
            document.getElementById('certificate-modal').style.display = 'flex';
        }
        
        function closeCertificate() {
            document.getElementById('certificate-modal').style.display = 'none';
        }
        
        function retryQuiz() {
            document.querySelectorAll('.answer-input').forEach(input => {
                input.value = '';
                input.style.borderColor = '';
                input.style.backgroundColor = '';
                input.disabled = false;
            });
            
            document.querySelectorAll('.answer-feedback').forEach(feedback => {
                feedback.innerHTML = '';
                feedback.style.display = 'none';
            });
            
            initializeQuiz();
        }
        
        // ==============================
        // INITIALIZATION
        // ==============================
        
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, initializing quiz...');
            initializeQuiz();
            
            document.getElementById('submit-btn').addEventListener('click', checkAnswers);
            document.getElementById('retry-btn').addEventListener('click', retryQuiz);
            document.getElementById('certificate-close').addEventListener('click', closeCertificate);
            
            document.getElementById('certificate-modal').addEventListener('click', function(e) {
                if (e.target === this) closeCertificate();
            });
            
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeCertificate();
            });
            
            document.getElementById('student-name').focus();
            
            document.getElementById('student-name').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const firstInput = document.querySelector('.answer-input:not(:disabled)');
                    if (firstInput) {
                        firstInput.focus();
                    }
                }
            });
        });
    </script>
</body>
</html>
